name: Android APK Build
# trigger: build verification v3

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Surface build errors as annotations
        if: failure()
        run: |
          { grep -E "^e: |error:| FAILED|AssertionError|expected:" build.log | head -30; awk '/What went wrong/{f=8} f>0{print; f--}' build.log; } | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::${line}"; done
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Music-Android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
